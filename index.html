<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>全電商後台</title>
<style>
  :root{
    --primary:#169BD5;
    --text:#333333;
    --text-sub:#999999;
    --border:#E3E6EB;
    --bg:#F4F6F9;
    --sidebar-bg:#1B2A4A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;color:var(--text);background:var(--bg);
  }
  .wrap{text-align:center;}
  .logo{
    width:52px;height:52px;border-radius:10px;background:var(--sidebar-bg);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;
    margin:0 auto 14px;
  }
  h1{font-size:18px;font-weight:700;margin:0 0 26px;color:var(--text);}
  .entry-list{display:flex;flex-direction:column;gap:14px;width:320px;}
  .entry-btn{
    display:block;padding:16px 20px;border-radius:10px;border:1px solid var(--border);background:#fff;
    color:var(--text);font-size:15px;font-weight:700;text-decoration:none;transition:border-color .15s,color .15s;
  }
  .entry-btn:hover{border-color:var(--primary);color:var(--primary);}
  .entry-sub{margin:26px 0 0;font-size:12px;font-weight:700;color:var(--text-sub);text-align:left;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">全</div>
  <h1>全電商後台 — 請選擇入口</h1>
  <div class="entry-list">
    <a class="entry-btn" href="批次申請全聯貨號.html">預購批次申請全聯貨號</a>
    <a class="entry-btn" href="商品批次提報.html">大眾轉單批次提報</a>
    <p class="entry-sub">文件</p>
    <a class="entry-btn" href="SCM批次提報(含標籤)_系統分析.html" target="_blank">系統分析文件</a>
    <a class="entry-btn" href="SCM批次提報(含標籤)_JIRA清單.html" target="_blank">JIRA 清單</a>
  </div>
</div>
</body>
</html>
